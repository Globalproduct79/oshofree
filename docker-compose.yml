services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: oshofree
      POSTGRES_PASSWORD: oshofree
      POSTGRES_DB: oshofree
    volumes:
      - oshofree_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  oshofree_pgdata:
