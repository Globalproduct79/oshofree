name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oshofree
          POSTGRES_PASSWORD: oshofree
          POSTGRES_DB: oshofree_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U oshofree"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
        env:
          DATABASE_URL: postgresql://oshofree:oshofree@localhost:5433/oshofree_test

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oshofree
          POSTGRES_PASSWORD: oshofree
          POSTGRES_DB: oshofree_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U oshofree"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://oshofree:oshofree@localhost:5433/oshofree_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
